name: Update Website and Playtime Data

# Three scheduled jobs, intentionally staggered so they don't fight
# over SteamGifts' rate limit at the same time:
#
#   • Every 8h (00 / 08 / 16 UTC)  → website data (giveaways, members
#                                    metadata, game prices, HLTB, and Steam
#                                    review summaries — reviews ride along
#                                    with prices since both iterate the same
#                                    giveaways ∪ wishlist game set).
#   • Daily 01:00 UTC               → playtime data (Steam Web API),
#                                    mode=daily, 45-min budget cap.
#                                    Refreshes every win older than 1
#                                    day so stats stay current.
#   • 1st + 15th, 06:15 UTC        → group wishlist scrape (≈ every 2
#                                    weeks, to save compute), isolated
#                                    so it doesn't run alongside the
#                                    giveaway scraper which is the
#                                    other heavy SG endpoint; followed by
#                                    game-insights (per-member ownership/
#                                    wishlist status + SteamGifts bundled
#                                    flag for every wishlist game).
#   • 1st + 15th, 06:40 UTC        → full challenge refresh including
#                                    dormant (finished) challenges; the
#                                    hourly run covers active ones only.
#
# Projections (146 users × ~1875 wins, ~1.3 s/win observed locally):
#   • Full daily refresh: ~1700 calls, ≈ 37 min wallclock
#   • Steam quota:        ~1.9% of the 100 k/day per-key limit
#
# The 45-min PLAYTIME_BUDGET_MINUTES cap is a safety net only; if the
# run is interrupted, the priority queue picks up missing/stale items
# first on the next run.
#
# Cron minutes are intentionally staggered OFF the top of the hour. Two reasons:
#   1. GitHub's scheduled-event queue is most congested at minute :00, so runs
#      there are routinely delayed or dropped entirely (this is why the hourly
#      challenge sometimes skipped). Off-peak minutes are far more reliable.
#   2. Distinct minutes mean no two jobs fire in the same minute, so they don't
#      race to push. The rebase-retry loop in each push step is the backstop for
#      the case where a delayed run still overlaps another.
#
# Off-peak minutes reduce the delays but do not remove them: the daily playtime
# cron has landed as much as 5h late, and the hourly challenge cron produces
# 10-15 runs a day rather than 24. The `plan` job therefore re-checks every
# dataset on every fire and revives whichever are stale, so each job runs on its
# own cron OR when it is overdue. Staleness is then bounded by the gap between
# fires (an hour or two) instead of by the cron period.
on:
  schedule:
    - cron: '15 0,8,16 * * *'  # website data, every 8 hours
    - cron: '30 1 * * *'       # playtime data, daily
    - cron: '15 6 1,15 * *'    # wishlist, 1st + 15th of the month (~biweekly)
    - cron: '25 * * * *'       # gaming challenge leaderboard (active), hourly
    - cron: '40 6 1,15 * *'    # all challenges incl. dormant (~biweekly)
    - cron: '20 1,9,17 * * *'  # verification data (IPB Discord + beaten), 3×/day
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: false
        default: 'website'
        type: choice
        options:
          - website
          - wishlist
          - playtime
          - playtime-all
          - challenge
          - verification

permissions:
  contents: write
  actions: read

jobs:
  # GitHub's scheduled-event queue delays and drops fires, so the crons above
  # are a best effort rather than a guarantee. This job runs on every fire and
  # reports which datasets have gone stale; each job below then runs on its own
  # cron OR when this says it is overdue, so a dropped slot is picked up by the
  # next fire instead of waiting a full cron period.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      website_due: ${{ steps.check.outputs.website_due }}
      playtime_due: ${{ steps.check.outputs.playtime_due }}
      wishlist_due: ${{ steps.check.outputs.wishlist_due }}
      challenge_due: ${{ steps.check.outputs.challenge_due }}
      challenge_all_due: ${{ steps.check.outputs.challenge_all_due }}
      verification_due: ${{ steps.check.outputs.verification_due }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check which datasets are stale
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/check-stale-data.sh

  website-data:
    needs: plan
    if: |
      github.event.schedule == '15 0,8,16 * * *' ||
      needs.plan.outputs.website_due == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'website') ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    # Runs have grown to ~30 min as the giveaways ∪ wishlist set grows (the
    # price/review loop iterates it fresh each run); cap at 50 so a stuck
    # HLTB/SG fetch still can't burn the default 6h runner allowance.
    timeout-minutes: 50
    env:
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      SG_TOKEN: ${{ secrets.SG_TOKEN }}
      SG_COOKIE: ${{ secrets.SG_COOKIE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync branch with latest changes
        run: git pull --rebase origin ${{ github.ref_name }} || true

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Generate website data (no playtime, no wishlist)
        run: pnpm run data

      - name: Commit and push website data changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # giveaway_leavers.json lives outside public/data but is written by
          # the same scrape — without staging it, every run's leaver
          # detections were silently discarded with the runner.
          git add packages/website/public/data/ packages/website/investigation/giveaway_leavers.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Update website data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            # Another staggered job may have pushed while we ran — rebase onto
            # the latest and retry rather than failing the whole run.
            for attempt in 1 2 3 4 5; do
              if git push origin ${{ github.ref_name }}; then
                echo "Pushed on attempt $attempt"; break
              fi
              if [ "$attempt" = "5" ]; then
                echo "Push still rejected after 5 attempts"; exit 1
              fi
              echo "Push rejected (attempt $attempt) — rebasing on latest and retrying"
              # The data step can leave modified files outside the staged
              # paths; they'd make the rebase abort with "unstaged changes".
              git checkout -- .
              git pull --rebase origin ${{ github.ref_name }}
              sleep 5
            done
          fi

  wishlist:
    needs: plan
    if: |
      github.event.schedule == '15 6 1,15 * *' ||
      needs.plan.outputs.wishlist_due == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'wishlist')
    runs-on: ubuntu-latest
    # ~40 pages × 2.5s + room for 5 retries × up to 480s back-off ≈ 25 min
    # worst-case for the wishlist scrape, plus ~2-5 min steady-state for the
    # game-insights step (bundled-status cache keeps reruns cheap; a fresh
    # CI run inherits the locally-committed cache so it isn't starting cold).
    timeout-minutes: 35
    env:
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      SG_TOKEN: ${{ secrets.SG_TOKEN }}
      SG_COOKIE: ${{ secrets.SG_COOKIE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync branch with latest changes
        run: git pull --rebase origin ${{ github.ref_name }} || true

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Scrape group wishlist
        run: pnpm --filter scraper run wishlist

      - name: Generate game insights (ownership, wishlist status, bundled flag)
        run: pnpm --filter scraper run game-insights

      - name: Commit and push wishlist changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add packages/website/public/data/wishlist.json packages/website/public/data/game_insights.json packages/scraper/data/game-insights-cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "💝 Update wishlist - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            # Another staggered job may have pushed while we ran — rebase onto
            # the latest and retry rather than failing the whole run.
            for attempt in 1 2 3 4 5; do
              if git push origin ${{ github.ref_name }}; then
                echo "Pushed on attempt $attempt"; break
              fi
              if [ "$attempt" = "5" ]; then
                echo "Push still rejected after 5 attempts"; exit 1
              fi
              echo "Push rejected (attempt $attempt) — rebasing on latest and retrying"
              # The data step can leave modified files outside the staged
              # paths; they'd make the rebase abort with "unstaged changes".
              git checkout -- .
              git pull --rebase origin ${{ github.ref_name }}
              sleep 5
            done
          fi

  playtime:
    needs: plan
    if: |
      github.event.schedule == '30 1 * * *' ||
      needs.plan.outputs.playtime_due == 'true' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.job == 'playtime' || github.event.inputs.job == 'playtime-all'))
    runs-on: ubuntu-latest
    # PLAYTIME_BUDGET_MINUTES=45 is the soft cap (exits cleanly, commits
    # partial progress, defers leftover wins to tomorrow). This 60-min
    # runner timeout is the hard backstop if a fetch() gets stuck and the
    # budget check never gets a chance to run.
    timeout-minutes: 60
    env:
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      SG_TOKEN: ${{ secrets.SG_TOKEN }}
      SG_COOKIE: ${{ secrets.SG_COOKIE }}
      # Safety net: cap a single run so a stalled call can't burn the
      # whole CI hour. Anything still pending rolls into tomorrow's run
      # automatically (priority queue surfaces missing/stale wins first).
      PLAYTIME_BUDGET_MINUTES: '45'
      PLAYTIME_MODE: >-
        ${{
          (github.event.inputs.job == 'playtime-all' && 'all') ||
          'daily'
        }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync branch with latest changes
        run: git pull --rebase origin ${{ github.ref_name }} || true

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Generate playtime data (${{ env.PLAYTIME_MODE }})
        run: pnpm --filter scraper run playtime

      - name: Commit and push playtime changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add packages/website/public/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🎮 Update playtime data (${{ env.PLAYTIME_MODE }}) - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            # Another staggered job may have pushed while we ran — rebase onto
            # the latest and retry rather than failing the whole run.
            for attempt in 1 2 3 4 5; do
              if git push origin ${{ github.ref_name }}; then
                echo "Pushed on attempt $attempt"; break
              fi
              if [ "$attempt" = "5" ]; then
                echo "Push still rejected after 5 attempts"; exit 1
              fi
              echo "Push rejected (attempt $attempt) — rebasing on latest and retrying"
              # The data step can leave modified files outside the staged
              # paths; they'd make the rebase abort with "unstaged changes".
              git checkout -- .
              git pull --rebase origin ${{ github.ref_name }}
              sleep 5
            done
          fi

  challenge:
    # Refreshes the gaming-challenge leaderboards. The hourly cron covers only
    # ACTIVE challenges (dormant/finished ones are skipped by the generator);
    # the 1st/15th cron re-runs everything including dormant challenges so
    # their review/playtime stats don't go permanently stale. Light (a few
    # hundred Steam calls total), so it stays clear of the SteamGifts-heavy jobs.
    needs: plan
    if: |
      github.event.schedule == '25 * * * *' ||
      github.event.schedule == '40 6 1,15 * *' ||
      needs.plan.outputs.challenge_due == 'true' ||
      needs.plan.outputs.challenge_all_due == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'challenge')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      # The biweekly schedule refreshes dormant (finished) challenges too.
      INCLUDE_DORMANT: ${{ (github.event.schedule == '40 6 1,15 * *' || needs.plan.outputs.challenge_all_due == 'true') && 'true' || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync branch with latest changes
        run: git pull --rebase origin ${{ github.ref_name }} || true

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Generate gaming challenge leaderboard data
        run: pnpm --filter scraper run challenge

      - name: Commit and push challenge changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add packages/website/public/data/challenge_*.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🏆 Update challenge leaderboard - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            # Another staggered job may have pushed while we ran — rebase onto
            # the latest and retry rather than failing the whole run.
            for attempt in 1 2 3 4 5; do
              if git push origin ${{ github.ref_name }}; then
                echo "Pushed on attempt $attempt"; break
              fi
              if [ "$attempt" = "5" ]; then
                echo "Push still rejected after 5 attempts"; exit 1
              fi
              echo "Push rejected (attempt $attempt) — rebasing on latest and retrying"
              # The data step can leave modified files outside the staged
              # paths; they'd make the rebase abort with "unstaged changes".
              git checkout -- .
              git pull --rebase origin ${{ github.ref_name }}
              sleep 5
            done
          fi

  verification:
    # Verification data for the /verification admin page, in two steps:
    #   1. ipb-discord — matches "i-play-bro" Discord forum threads to wins
    #      (starter-message giveaway/store/review links). Discord user and
    #      thread lookups are permanently cached, so steady-state runs only
    #      fetch threads created since the last run.
    #   2. beaten — per-game "beaten marker" achievements + per-winner unlock
    #      checks. Markers come from the committed Steam Hunters tags file
    #      (the live pages are Cloudflare-gated from CI; refresh the file
    #      locally via a browser session when new games need tags) with a
    #      description heuristic as fallback. Marker and player-check caches
    #      are committed, so steady-state runs touch only new wins and the
    #      7-day re-checks of not-yet-beaten markers.
    # Runs an hour after the website-data job so it sees fresh giveaway/member
    # flags. Worst case is bounded by the scripts' per-run fetch caps
    # (200 markers / 500 player checks, deferring the rest to the next run),
    # which keeps a cold-cache run around 20 min; steady state is a few
    # minutes. timeout-minutes is the backstop on top of that.
    needs: plan
    if: |
      github.event.schedule == '20 1,9,17 * * *' ||
      needs.plan.outputs.verification_due == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'verification')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      SKIP_STEAMHUNTERS: '1'
      STEAMHUNTERS_TAGS_FILE: ${{ github.workspace }}/packages/scraper/data/steamhunters-tags.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync branch with latest changes
        run: git pull --rebase origin ${{ github.ref_name }} || true

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Match I Play Bro Discord submissions
        run: pnpm --filter scraper run ipb-discord

      - name: Generate beaten-games data
        run: pnpm --filter scraper run beaten

      - name: Commit and push verification data changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add packages/website/public/data/beaten_games.json \
                  packages/website/public/data/ipb_discord.json \
                  packages/scraper/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🕵️ Update verification data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            # Another staggered job may have pushed while we ran — rebase onto
            # the latest and retry rather than failing the whole run.
            for attempt in 1 2 3 4 5; do
              if git push origin ${{ github.ref_name }}; then
                echo "Pushed on attempt $attempt"; break
              fi
              if [ "$attempt" = "5" ]; then
                echo "Push still rejected after 5 attempts"; exit 1
              fi
              echo "Push rejected (attempt $attempt) — rebasing on latest and retrying"
              # The data step can leave modified files outside the staged
              # paths; they'd make the rebase abort with "unstaged changes".
              git checkout -- .
              git pull --rebase origin ${{ github.ref_name }}
              sleep 5
            done
          fi
